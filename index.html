<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One-Hour Skill Trainer — AI Learning Aggregator</title>
    <meta name="description" content="Discover the best technical learning resources across YouTube, Coursera, and Udemy — then master any skill in a focused 60-minute AI-curated session." />
    <meta name="theme-color" content="#070a12" />

    <!-- Open Graph -->
    <meta property="og:title" content="One-Hour Skill Trainer" />
    <meta property="og:description" content="AI-powered learning aggregator. Search, compare, and master technical skills in 60 minutes." />
    <meta property="og:type" content="website" />

    <!-- Preconnect fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Theme init (prevent FOUC) -->
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
